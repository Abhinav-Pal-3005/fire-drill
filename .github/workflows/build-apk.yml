name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build variant (release requires signing secrets; otherwise builds installable debug APK)"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK & Licenses
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            sudo mkdir -p "$SDK_DIR/cmdline-tools" 2>/dev/null || mkdir -p "$SDK_DIR/cmdline-tools"
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR" 2>/dev/null || true
            curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
            mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-unpack
          elif [ ! -w "$SDK_DIR" ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR"
          fi

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-unpack
            mv /tmp/cmdline-tools-unpack/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-unpack
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          # Accept SDK licenses (disable pipefail briefly so yes SIGPIPE does not fail)
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null 2>&1 || true
          set -o pipefail

          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK_DIR/licenses/android-sdk-preview-license"

          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install app dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install --legacy-peer-deps --no-audit --no-fund @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0

      - name: Build Next.js static export
        run: |
          set -euo pipefail
          API_BACKUP="/tmp/next-api-backup"
          rm -rf "$API_BACKUP"
          if [ -d "src/app/api" ]; then
            mv src/app/api "$API_BACKUP"
          fi
          trap 'if [ -d "$API_BACKUP" ] && [ ! -d "src/app/api" ]; then mv "$API_BACKUP" src/app/api; fi' EXIT
          NODE_ENV=production NEXT_STATIC_EXPORT=true npm run build
          test -f out/index.html
          test -d out/_next/static

      - name: Generate & sync Capacitor Android project
        run: |
          set -euo pipefail
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Gradle SDK, version & asset packaging
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          node -e '
            const fs = require("fs");
            const path = "android/app/build.gradle";
            let gradle = fs.readFileSync(path, "utf8");
            const buildNumber = Number(process.env.BUILD_NUMBER || 1);
            gradle = gradle.replace(/versionCode\s+\d+/, `versionCode ${buildNumber}`);
            gradle = gradle.replace(/versionName\s+"[^"]*"/, `versionName "1.0.${buildNumber}"`);
            const safePattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~";
            if (/ignoreAssetsPattern/.test(gradle)) {
              gradle = gradle.replace(/ignoreAssetsPattern\s*=?\s*["\x27][^"\x27]*["\x27]/g,
                `ignoreAssetsPattern "${safePattern}"`);
            } else {
              gradle = gradle.replace(/android\s*\{/,
                `android {\n    aaptOptions {\n        ignoreAssetsPattern "${safePattern}"\n    }`);
            }
            fs.writeFileSync(path, gradle);
          '

      - name: Build Android APK
        id: build
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUESTED_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set -euo pipefail
          mkdir -p dist-apk
          cd android
          chmod +x gradlew

          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASS:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASS:-}" ] && { [ "$REQUESTED_TYPE" = "release" ] || [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; }; then
            echo "$KEYSTORE_B64" | base64 --decode > app/release.keystore
            ./gradlew assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$(pwd)/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
            RAW_APK="app/build/outputs/apk/release/app-release.apk"
            VARIANT="release"
          else
            ./gradlew assembleDebug --no-daemon
            RAW_APK="app/build/outputs/apk/debug/app-debug.apk"
            VARIANT="debug"
          fi

          # Verify Next.js static bundle is inside the APK (avoid pipe SIGPIPE)
          unzip -Z1 "$RAW_APK" > /tmp/apk-files.txt
          grep -q "assets/public/index.html" /tmp/apk-files.txt
          grep -q "assets/public/_next/static/" /tmp/apk-files.txt

          OUT_APK="../dist-apk/Money-Fire-Drill-${VARIANT}.apk"
          cp "$RAW_APK" "$OUT_APK"
          rm -f app/release.keystore /tmp/apk-files.txt

          echo "apk_path=dist-apk/Money-Fire-Drill-${VARIANT}.apk" >> "$GITHUB_OUTPUT"
          echo "apk_name=Money-Fire-Drill-${VARIANT}.apk" >> "$GITHUB_OUTPUT"
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          sha256sum "$OUT_APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Money-Fire-Drill-APK
          path: ${{ steps.build.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      - name: Attach APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.apk_path }}

      - name: Write Build Summary
        run: |
          {
            echo "### Android APK Build Complete"
            echo ""
            echo "- **App**: Money Fire Drill (\`com.moneyfiredrill.app\`)"
            echo "- **Variant**: \`${{ steps.build.outputs.variant }}\`"
            echo "- **Artifact**: \`Money-Fire-Drill-APK\` (\`${{ steps.build.outputs.apk_name }}\`)"
            echo "- **Version**: \`1.0.${{ github.run_number }}\` (code \`${{ github.run_number }}\`)"
          } >> "$GITHUB_STEP_SUMMARY"
